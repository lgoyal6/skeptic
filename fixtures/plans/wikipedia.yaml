    doc_claims: srlimit must be between 1 and 500; out-of-range values produce a warning.
    truth: Held, and this is the control for the clamp class. srlimit=5000 returns 500 results AND a warnings.search
      entry naming the parameter, the offending value 5000, and the permitted range. The clamp matches
