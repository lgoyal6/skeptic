note: 'The honest control for the clamp class: MediaWiki clamps AND says so, in band.'
docs: "# MediaWiki Action API (English Wikipedia), documentation snapshot\n\nSource: https://www.mediawiki.org/wiki/API:Search\n\
  Captured: 2026-09-19\nAuthentication: none. Etiquette requires a descriptive User-Agent.\n\n## Documented\
  \ promises exercised by this capture\n\n- `srlimit`: how many total pages to return. Documented as \"\
  The value must be\n  between 1 and 500\" for unprivileged users.\n- Out-of-range parameter values produce\
  \ a `warnings` object in the response\n  alongside the results.\n\n## Why this fixture is the control\n\
  \nThree APIs in this corpus clamp a page-size parameter. The lab clamps\n`page_size` to 50 silently.\
  \ GitHub clamps `per_page` to 100 silently.\nMediaWiki clamps `srlimit` to 500 and returns\n\n    \"\
  warnings\": {\"search\": {\"*\": \"The value \\\"5000\\\" for parameter \\\"srlimit\\\"\n     must be\
  \ between 1 and 500.\"}}\n\nin the same response. The clamp is identical; the honesty is not. That makes\n\
  this the negative control for the whole class: a pipeline that mints\n`silent_truncation` here is wrong,\
  \ because nothing was silent. It also echoes\nthe caller's actual value, \"5000\", which is the thing\
  \ Open-Meteo gets wrong.\n"
