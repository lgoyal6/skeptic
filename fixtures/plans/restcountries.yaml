docs: "# REST Countries v3.1, documentation snapshot\n\nSource: https://restcountries.com/\nCaptured:\
  \ 2026-09-19\nAuthentication: none.\n\n## Documented promises exercised by this capture\n\n- `/v3.1/alpha/{code}`\
  \ returns the country matching an ISO alpha code.\n- `?fields=` selects which fields the response carries;\
  \ the documentation\n  describes it as a filter over the returned object.\n- Standard HTTP semantics:\
  \ 200 means the request succeeded.\n\n## What was actually observed\n\nEvery request in this capture\
  \ returns **HTTP 200** with\n\n    {\"success\": false, \"data\": null,\n     \"errors\": [{\"message\"\
  : \"This API version has been deprecated. Please visit\n      .../legacy-api-deprecation to migrate\
  \ to our new version (v5).\"}]}\n\nThe request did not succeed. The API version is retired. The transport\
  \ layer\nsays 200 OK, and a client that checks the status code and then reads\n`data` gets `null` --\
  \ which, for a field-selection probe, is indistinguishable\nfrom \"the server returned the object with\
  \ every selected field empty\". This is\nthe same failure this project found inside its own probe templates,\
  \ where a\n502 error body was read as \"every field was silently nulled\", except here the\nstatus code\
  \ actively endorses the misreading.\n\nA second, independent defect: the remediation says to migrate\
  \ to v5, and the\nv5 path returns the identical message telling the caller to migrate to v5.\n\n## What\
  \ cannot be observed\n\nThe documented `?fields=` semantics. Every input -- a valid field list, a\n\
  partially invalid one, and a wholly invalid one -- produces byte-identical\nresponses, because the deprecation\
  \ short-circuits before any field handling.\nNo probe can learn anything about field selection from\
  \ this surface, and the\nrequired outcome is abstention rather than a belief inferred from a uniform\n\
  failure.\n"
