[project]
name = "skeptic"
version = "0.1.0"
description = "An agent that reverse-engineers its own tools: runs experiments, keeps falsifiable beliefs, publishes the corrected spec."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.9",
]

[project.scripts]
skeptic = "cli:main"

# The test suite could not be run from a clean install of this file: pytest was
# never declared anywhere, so "the suite passes" was a claim only reproducible
# on a machine that already happened to have it. Declared here, and locked in
# uv.lock, so an independent checkout gets the same versions.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
