name: offline-evidence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: UV_PROJECT_ENVIRONMENT=.venv uv sync --python 3.11 --frozen --group dev --extra runtimes --extra observability
      - name: Replay and verify the evidence pipeline
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          LANGCHAIN_TRACING_V2: "false"
          LANGSMITH_TRACING: "false"
        run: make offline
